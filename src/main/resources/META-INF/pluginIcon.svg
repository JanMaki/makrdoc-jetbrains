<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- {%}：Markdoc のタグの記号。フォントに依存しないよう、すべてパスで描く -->
  <rect width="40" height="40" rx="8" fill="#FFD84A"/>
  <g fill="none" stroke="#1A1A1D" stroke-linecap="round" stroke-linejoin="round">
    <!-- { -->
    <path d="M10 10C8 10 7.6 11 7.6 12.6V17.4C7.6 18.6 7 19.5 6 20C7 20.5 7.6 21.4 7.6 22.6V27.4C7.6 29 8 30 10 30" stroke-width="2"/>
    <!-- } -->
    <path d="M30 10C32 10 32.4 11 32.4 12.6V17.4C32.4 18.6 33 19.5 34 20C33 20.5 32.4 21.4 32.4 22.6V27.4C32.4 29 32 30 30 30" stroke-width="2"/>
    <!-- % の斜線 -->
    <path d="M24.2 12.4L15.8 27.6" stroke-width="2.6"/>
  </g>
  <!-- % の点 -->
  <g fill="#1A1A1D">
    <circle cx="15.9" cy="14.6" r="2.3"/>
    <circle cx="24.1" cy="25.4" r="2.3"/>
  </g>
</svg>
